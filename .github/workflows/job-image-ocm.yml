name: Image OCM Component
on:
  workflow_call:
    inputs:
      imageReference:
        description: "Full image reference (e.g., ghcr.io/platform-mesh/security-operator:1.2.3)"
        required: true
        type: string
      appVersion:
        description: "Version for the component (matches image tag)"
        required: true
        type: string
      repoName:
        description: "Source repository name (for component naming and source metadata)"
        required: true
        type: string
      commit:
        description: "Git commit SHA for provenance"
        required: true
        type: string
      componentName:
        description: "Full OCM component name (e.g., github.com/platform-mesh/images/my-component). Defaults to github.com/platform-mesh/images/<repoName>"
        required: false
        type: string
        default: ""
      ocmRegistryUrl:
        description: "OCM registry URL"
        type: string
        default: ghcr.io/platform-mesh
      extraResources:
        description: |
          Additional OCM resources, as a YAML list appended to the component's
          `resources`. Indentation is normalised, so the list can be written at
          column 0.

          Go-templated with the same variables as the built-in resources:
          .COMPONENT_NAME, .APP_VERSION, .IMAGE_REFERENCE, .REPO_NAME, .COMMIT.

          A resource with an `input:` reads a file from the job's workspace, so
          anything but an `access:` reference needs extraResourcesArtifact too.
        required: false
        type: string
        default: ""
      extraResourcesArtifact:
        description: |
          Name of a workflow artifact holding the files `extraResources` refers
          to by path. Downloaded into the workspace before the component is
          built, alongside the SBOMs.
        required: false
        type: string
        default: ""

jobs:
  image-ocm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Download extra resource files
        if: inputs.extraResourcesArtifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.extraResourcesArtifact }}

      - name: Setup OCM CLI
        run: |
          REPO=${repo:=open-component-model/ocm}
          if [ -z "$version" -o "$version" == latest ]; then
            version="$(basename "$(curl -Ls -o /dev/null -w %{url_effective} https://github.com/$REPO/releases/latest)")"
            echo "Selecting latest version: $version"
          fi
          VERSION=${version#v}
          ARCHIVE_FILE="ocm-${VERSION}-linux-amd64.tar.gz"
          URL="https://github.com/$REPO/releases/download/v${VERSION}/$ARCHIVE_FILE"
          echo "Installing ocm-cli version $version from $REPO"
          curl -LsS -o ocm-cli.tgz "$URL"
          tar --overwrite -xvzf ocm-cli.tgz >/dev/null
          chmod a+x ocm

      - name: Write OCM credentials file
        run: |
          OCM_REGISTRY_URL="${{ inputs.ocmRegistryUrl }}"
          OCM_HOSTNAME="${OCM_REGISTRY_URL%%/*}"
          OCM_PATHPREFIX="${OCM_REGISTRY_URL#*/}"
          cat <<EOF > $HOME/.ocmconfig
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    scheme: https
                    hostname: ${OCM_HOSTNAME}
                    pathprefix: ${OCM_PATHPREFIX}
                  credentials:
                    - type: Credentials
                      properties:
                        username: github
                        password: ${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Write component constructor
        run: |
          cat <<'EOF' > component-constructor.yaml
          components:
            - name: {{ .COMPONENT_NAME }}
              version: "{{ .APP_VERSION }}"
              provider:
                name: Platform Mesh Team
              sources:
                - name: source
                  type: git
                  version: "{{ .APP_VERSION }}"
                  access:
                    commit: "{{ .COMMIT }}"
                    repoUrl: https://github.com/platform-mesh/{{ .REPO_NAME }}
                    type: gitHub
              resources:
                - name: image
                  type: ociImage
                  relation: external
                  version: "{{ .APP_VERSION }}"
                  access:
                    type: ociArtifact
                    imageReference: "{{ .IMAGE_REFERENCE }}"
                - name: sbom-cyclonedx
                  type: sbom
                  input:
                    type: file
                    path: sbom-cyclonedx.json
                    mediaType: application/vnd.cyclonedx+json
                - name: sbom-spdx
                  type: sbom
                  input:
                    type: file
                    path: sbom-spdx.json
                    mediaType: application/spdx+json
          EOF

      - name: Append extra resources
        if: inputs.extraResources != ''
        # Read from the environment, not interpolated into the script: the input
        # is caller-controlled multi-line YAML, and expanding it inline would
        # both break the quoting and make the step an injection point.
        env:
          EXTRA_RESOURCES: ${{ inputs.extraResources }}
        run: |
          python3 - >> component-constructor.yaml <<'PY'
          import os, sys, textwrap

          body = textwrap.dedent(os.environ["EXTRA_RESOURCES"]).strip("\n")
          if not body:
              sys.exit(0)
          if not body.lstrip().startswith("-"):
              sys.exit("extraResources must be a YAML list of resources")
          # 6 spaces: the indentation of the items under `resources:` above.
          sys.stdout.write(textwrap.indent(body, " " * 6) + "\n")
          PY
          echo "--- component-constructor.yaml"
          cat component-constructor.yaml

      - name: Create OCM ComponentArchive
        run: |
          COMPONENT_NAME="${{ inputs.componentName || format('github.com/platform-mesh/images/{0}', inputs.repoName) }}"
          ocm_ctf=transport.ctf
          ./ocm add components -c --templater=go --file "$ocm_ctf" component-constructor.yaml -- \
            APP_VERSION=${{ inputs.appVersion }} \
            IMAGE_REFERENCE=${{ inputs.imageReference }} \
            COMPONENT_NAME="${COMPONENT_NAME}" \
            REPO_NAME=${{ inputs.repoName }} \
            COMMIT=${{ inputs.commit }}

      - name: Download CA certificate
        run: gh api repos/platform-mesh/helm-charts/contents/.ocm/signature/ca.cert --jq '.content' | base64 -d > /tmp/ca.cert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign OCM component
        run: |
          printf '%s' "$OCM_SIGNING_PRIVATE_KEY" > /tmp/ocm-signing.priv
          printf '%s' "$OCM_SIGNING_CERT" > /tmp/ocm-signing.cert
          ./ocm sign componentversion \
            --signature ${{ inputs.repoName }}.platform-mesh \
            --private-key /tmp/ocm-signing.priv \
            --public-key /tmp/ocm-signing.cert \
            --ca-cert /tmp/ca.cert \
            transport.ctf
          rm -f /tmp/ocm-signing.priv /tmp/ocm-signing.cert /tmp/ca.cert
        env:
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ secrets.OCM_SIGNING_CERT }}

      - name: Transfer to OCM registry
        run: ./ocm transfer ctf transport.ctf "${{ inputs.ocmRegistryUrl }}"
