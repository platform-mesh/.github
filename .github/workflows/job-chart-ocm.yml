name: Chart OCM Component
on:
  workflow_call:
    inputs:
      chartPath:
        description: "Path to the chart directory"
        required: true
        type: string
      chartName:
        description: "Name of the chart"
        required: true
        type: string
      chartRepository:
        description: "Chart repository URL (defaults to platform-mesh/helm-charts)"
        type: string
        default: https://github.com/platform-mesh/helm-charts
      componentConstructorFile:
        description: "Path to component constructor file"
        type: string
        default: .ocm/component-constructor-chart-only.yaml
      componentName:
        description: "Component name (e.g., github.com/platform-mesh/helm-charts/security-operator)"
        required: true
        type: string
      ocmRegistryUrl:
        description: "OCM registry URL"
        type: string
        default: ghcr.io/platform-mesh

jobs:
  chart-ocm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create Github App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: "1415820"
          private-key: ${{ secrets.PM_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup yq@latest
        run: |
          if ! command -v yq &>/dev/null
          then
            mkdir -p /home/runner/.local/bin
            wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /home/runner/.local/bin/yq &&\
              chmod +x /home/runner/.local/bin/yq
          fi

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OCM CLI
        run: |
          REPO="open-component-model/open-component-model"
          # renovate: datasource=github-releases depName=open-component-model/open-component-model
          version="v0.13.0"
          echo "Installing ocm-cli version $version from $REPO"
          curl -LsS -o ocm "https://github.com/$REPO/releases/download/${version}/ocm-linux-amd64"
          chmod a+x ocm

      - name: Prepare template variables
        run: |
          VERSION=$(yq '.version' ${{ inputs.chartPath }}/Chart.yaml)
          CHART_OCI_PATH=ghcr.io/platform-mesh/helm-charts/${{ inputs.chartName }}
          CHART_REPO=${{ inputs.chartRepository }}

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CHART_OCI_PATH=$CHART_OCI_PATH" >> $GITHUB_ENV
          echo "CHART_REPO=$CHART_REPO" >> $GITHUB_ENV

      - name: Write OCM credentials file
        run: |
          OCM_REGISTRY_URL="${{ inputs.ocmRegistryUrl }}"
          OCM_HOSTNAME="${OCM_REGISTRY_URL%%/*}"
          OCM_PATHPREFIX="${OCM_REGISTRY_URL#*/}"
          cat <<EOF > $HOME/.ocmconfig
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    scheme: https
                    hostname: ${OCM_HOSTNAME}
                    path: ${OCM_PATHPREFIX}
                  credentials:
                    - type: Credentials
                      properties:
                        username: github
                        password: ${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Create OCM ComponentArchive
        run: |
          ocm_ctf=ctf::transport.ctf
          ./ocm add component-versions --repository "$ocm_ctf" --constructor ${{ inputs.componentConstructorFile }}
        env:
          VERSION: ${{ env.VERSION }}
          COMPONENT_NAME: ${{ inputs.componentName }}
          CHART_OCI_PATH: ${{ env.CHART_OCI_PATH }}
          CHART_REPO: ${{ env.CHART_REPO }}
          COMMIT: ${{ github.sha }}

      - name: Download CA certificate
        run: gh api repos/platform-mesh/helm-charts/contents/.ocm/signature/ca.cert --jq '.content' | base64 -d > /tmp/ca.cert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign OCM component
        run: |
          cat >> $HOME/.ocmconfig << EOF
            - type: credentials.config.ocm.software
              consumers:
              - identity:
                  type: RSA/v1alpha1
                  algorithm: RSASSA-PSS
                  signature: helm-charts.platform-mesh
                credentials:
                - type: Credentials/v1
                  properties:
                    private_key_pem: |
          $(printf '%s' "$OCM_SIGNING_PRIVATE_KEY" | sed 's/^/            /')
                    public_key_pem: |
          $(printf '%s' "$OCM_SIGNING_CERT" | sed 's/^/            /')
          EOF
          ./ocm sign component-version \
            --signature helm-charts.platform-mesh \
            "ctf::transport.ctf//${{ inputs.componentName }}:${{ env.VERSION }}"
        env:
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ secrets.OCM_SIGNING_CERT }}

      - name: Transfer to OCM registry
        run: ./ocm transfer component-version "ctf::transport.ctf//${{ inputs.componentName }}:${{ env.VERSION }}" "${{ inputs.ocmRegistryUrl }}"

      - name: Trigger PlatformMesh OCM build
        run: |
          gh workflow run ocm-aggregator.yaml --repo "platform-mesh/helm-charts"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
